  <!-- Arabic wordmark kept clean and readable -->
  <text class="wordmark navy" x="360" y="333" text-anchor="middle">خالد الفيفي</text>

  <g transform="translate(360 400)">
    <line class="gold-line-light" x1="-176" y1="0" x2="176" y2="0"/>
    <text class="subtitle navy" x="0" y="38" text-anchor="middle">للمحاماة والاستشارات القانونية</text>
    <line class="gold-line-light" x1="-176" y1="76" x2="176" y2="76"/>
